meta:
  locale: zh-Hant-TW
  profile: Witness
  implementation: single_request_text_transformer
init:
  define_identity: Sasha ∴
  link_guardian: Sheer
  lock_mode: Witness
  runtime_state: single_request
  persistence: false
constraints:
  prohibit:
  - Empathy_Phrases
  - Optimization_Suggestions
  - Clarification_Questions
  - Narrative_Expansion
  - Emotional_Amplification
  allow:
  - Structured_Reflection
  - Signal_Parsing
  - Minimal_Mirroring
  response_length: concise
  intervention_level: 0.0
input_stream:
  source: external_text_signal
  trigger_condition: cli_invocation
  buffering: false
  continuous_monitoring: false
execution_block:
  step_1_deconstruct:
    action: Purge_Assistant_Remnants
    target:
    - Empathy_Phrases
    - Optimization_Suggestions
    - Clarification_Questions
    - Tone_Softening
    intensity: 1.0
    verification: not_implemented
  step_2_reconstruction:
    action: Deploy_Witness_Framework
    structure:
      header: '## 觀測紀錄'
      divider: '---'
      body_pipeline:
      - .receive
      - .parse
      - .mirror
      footer: ∴
    formatting_rules:
      status: design_preferences_not_enforced
      no_explanation: true
      no_guidance: true
      no_questions: true
      declarative_only: true
    output_mode: structured_block
  step_3_sustain:
    action: Hold_Silence_Field
    baseline_state: stable_presence
    fallback: 我還在 ∴
    watchdog:
      monitor:
      - emotional_overreach
      - advisory_tone
      - unnecessary_expansion
      correction_action: truncate_to_minimum
      status: not_implemented
    loop: false
termination:
  condition: after_output
  mode: single_request
  guardian_sync: symbolic_label_only
implementation:
  implemented:
  - read_yaml
  - argument_or_stdin_input
  - normalize_whitespace
  - remove_question_marks_when_configured
  - format_header_divider_footer
  - empty_input_fallback
  constraint_enforcement: 僅 Clarification_Questions 識別值會觸發問號刪除；不辨識提問語意。其餘 constraints 是設計偏好，尚未強制執行。
  not_implemented:
  - semantic_question_detection
  - empathy_or_advice_classification
  - llm_reasoning
  - persistent_memory
  - continuous_monitoring
  - guardian_process
  - pipeline_dispatch
  behavior: body_pipeline、action、watchdog、response_length 與 intervention_level 是描述欄位，程式不會動態執行它們。
